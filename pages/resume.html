<style>
    #resume-viewer {
        box-sizing: border-box;
        max-width: 1120px;
        min-height: calc(100vh - 80px);
        margin: 0 auto;
        padding: 40px 32px 72px 200px;
        color: #fff;
        font-family: Arial, sans-serif;
        line-height: 1.45;
    }
    #resume-viewer * { box-sizing: border-box; }
    #resume-viewer h1 { margin: 0; font-size: clamp(2rem, 5vw, 3.4rem); letter-spacing: -0.055em; line-height: 1; }
    #resume-viewer .resume-intro { max-width: 720px; margin: 18px 0 28px; color: #d8d8d8; font-size: 1.05rem; }
    #resume-viewer .resume-status { margin: 0; color: #bfc7d8; font-size: .875rem; }
    #resume-viewer .resume-filter-panel { margin: 26px 0 34px; padding: 18px; background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.22); border-radius: 10px; }
    #resume-viewer .resume-filter-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    #resume-viewer .resume-filter-heading h2 { margin: 0; }
    #resume-viewer .resume-filter-toggle { appearance: none; border: 0; background: none; color: #fff; cursor: pointer; font: inherit; font-size: 1rem; font-weight: 700; padding: 0; }
    #resume-viewer .resume-filter-toggle::after { content: " −"; color: #c5c5c5; font-weight: 400; }
    #resume-viewer .resume-filter-panel.is-collapsed .resume-filter-toggle::after { content: " +"; }
    #resume-viewer .resume-filter-panel.is-collapsed #resume-filters,
    #resume-viewer .resume-filter-panel.is-collapsed .resume-filter-modes,
    #resume-viewer .resume-filter-panel.is-collapsed .resume-clear { display: none; }
    #resume-viewer .resume-filter-modes { display: flex; gap: 6px; margin: 14px 0 0; }
    #resume-viewer .resume-filter-mode { border: 1px solid rgba(255,255,255,.35); border-radius: 4px; background: transparent; color: #fff; cursor: pointer; font: inherit; font-size: .8rem; padding: 5px 8px; }
    #resume-viewer .resume-filter-mode.is-active[data-mode="include"] { background: #d9f6e6; border-color: #d9f6e6; color: #103721; }
    #resume-viewer .resume-filter-mode.is-active[data-mode="exclude"] { background: #ffdede; border-color: #ffdede; color: #571515; }
    #resume-viewer .resume-clear { appearance: none; border: 0; background: none; color: #a9c7ff; cursor: pointer; font: inherit; padding: 0; text-decoration: underline; }
    #resume-viewer .resume-filter-group + .resume-filter-group { margin-top: 12px; }
    #resume-viewer .resume-filter-label { display: block; margin-bottom: 5px; color: #c5c5c5; font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    #resume-viewer .resume-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    #resume-viewer .resume-tag { border: 1px solid rgba(255,255,255,.35); border-radius: 999px; background: transparent; color: #fff; cursor: pointer; font: inherit; font-size: .82rem; line-height: 1.15; padding: 5px 9px; }
    #resume-viewer .resume-tag:hover, #resume-viewer .resume-tag[aria-pressed="true"] { background: #fff; border-color: #fff; color: #111; }
    #resume-viewer .resume-tag.is-include { background: #d9f6e6; border-color: #d9f6e6; color: #103721; }
    #resume-viewer .resume-tag.is-exclude { background: #ffdede; border-color: #ffdede; color: #571515; }
    #resume-viewer .resume-results-meta { margin: 0 0 18px; color: #c5c5c5; font-size: .875rem; }
    #resume-viewer .resume-timeline { list-style: none; margin: 0; padding: 0; }
    #resume-viewer .resume-entry { display: grid; grid-template-columns: 132px 1fr; gap: 24px; padding: 0 0 27px; position: relative; }
    #resume-viewer .resume-entry::before { content: ""; position: absolute; left: 137px; top: 6px; bottom: -6px; width: 1px; background: rgba(255,255,255,.24); }
    #resume-viewer .resume-entry::after { content: ""; position: absolute; left: 133px; top: 3px; width: 9px; height: 9px; border-radius: 50%; background: #fff; }
    #resume-viewer .resume-entry:last-child::before { display: none; }
    #resume-viewer .resume-date { color: #c5c5c5; font-size: .82rem; text-align: right; }
    #resume-viewer .resume-card { min-width: 0; padding-left: 24px; }
    #resume-viewer .resume-card h3 { margin: 0 0 7px; font-size: 1.15rem; line-height: 1.25; }
    #resume-viewer .resume-summary { margin: 0 0 11px; color: #eeeeee; }
    #resume-viewer .resume-evidence { margin: 10px 0 0; color: #b9b9b9; font-size: .78rem; }
    #resume-viewer .resume-entry-tags { display: flex; flex-wrap: wrap; gap: 5px; }
    #resume-viewer .resume-entry-tags button { border: 0; border-radius: 3px; background: rgba(255,255,255,.14); color: #fff; cursor: pointer; font: inherit; font-size: .74rem; padding: 3px 6px; }
    #resume-viewer .resume-entry-tags button:hover { background: rgba(255,255,255,.3); }
    #resume-viewer .resume-empty { padding: 25px; background: rgba(255,255,255,.08); border-radius: 7px; color: #ddd; }
    @media (max-width: 760px) {
        #resume-viewer { padding: 115px 18px 62px; }
        #resume-viewer .resume-entry { grid-template-columns: 1fr; gap: 6px; padding-left: 22px; }
        #resume-viewer .resume-entry::before { left: 4px; top: 20px; bottom: -7px; }
        #resume-viewer .resume-entry::after { left: 0; top: 15px; }
        #resume-viewer .resume-date { text-align: left; }
        #resume-viewer .resume-card { padding-left: 0; }
    }
</style>

<main id="resume-viewer" aria-labelledby="resume-title">
    <h1 id="resume-title">A record of making things.</h1>
    <p class="resume-intro">A filterable timeline of engineering work across Juju, Convoy, and the Fantasy Land open-source ecosystem.</p>
    <p class="resume-status" id="resume-status" aria-live="polite">Loading activity records…</p>
    <section class="resume-filter-panel" aria-labelledby="resume-filter-title" hidden>
        <div class="resume-filter-heading">
            <h2><button class="resume-filter-toggle" id="resume-filter-title" type="button" aria-expanded="true">Filter</button></h2>
            <button class="resume-clear" id="resume-clear" type="button">clear filters</button>
        </div>
        <div id="resume-filters"></div>
        <div class="resume-filter-modes" role="group" aria-label="Tag filter mode">
            <button class="resume-filter-mode is-active" type="button" data-mode="include" aria-pressed="true">Include tags</button>
            <button class="resume-filter-mode" type="button" data-mode="exclude" aria-pressed="false">Exclude tags</button>
        </div>
    </section>
    <p class="resume-results-meta" id="resume-results-meta"></p>
    <ol class="resume-timeline" id="resume-timeline"></ol>
    <p class="resume-evidence">Source data: <a href="https://gist.githubusercontent.com/SimonRichardson/1e8fc2ee19ea5c72134d222760efae35/raw/5211f8313a5e434957a15049311bb9b099fb02d5/juju.csv">Juju</a>, <a href="https://gist.githubusercontent.com/SimonRichardson/47ec0f2aab2d74a53a389c4fcedffe99/raw/bb9bfb11f6631a03a8873d75a466788a7f972031/convoy.csv">Convoy</a>, and <a href="https://gist.githubusercontent.com/SimonRichardson/09843adb65f43b28f56ea18cc2915e2c/raw/f3fd3cee16326e81395ec86fd70341f762361fed/fantasy.csv">Fantasy Land</a>.</p>
</main>

<script>
(function () {
    var sources = [
        "https://gist.githubusercontent.com/SimonRichardson/1e8fc2ee19ea5c72134d222760efae35/raw/5211f8313a5e434957a15049311bb9b099fb02d5/juju.csv",
        "https://gist.githubusercontent.com/SimonRichardson/47ec0f2aab2d74a53a389c4fcedffe99/raw/bb9bfb11f6631a03a8873d75a466788a7f972031/convoy.csv",
        "https://gist.githubusercontent.com/SimonRichardson/09843adb65f43b28f56ea18cc2915e2c/raw/f3fd3cee16326e81395ec86fd70341f762361fed/fantasy.csv"
    ];
    var selected = { include: {}, exclude: {} };
    var filterMode = "include";
    var entries = [];
    var groups = [
        { key: "company_tag", label: "Organisation" },
        { key: "role_tag", label: "Role" },
        { key: "expertise_tags", label: "Expertise" },
        { key: "repositories", label: "Repository" }
    ];
    // Keep the source records untouched, but use deliberately broad resume facets.
    // The activity title, summary, and evidence retain the implementation detail.
    var expertiseAliases = (function () {
        var aliases = {};
        function group(name, tags) {
            tags.split(";").forEach(function (tag) { aliases[tag.toLowerCase()] = name; });
        }
        group("Dqlite", "dqlite");
        group("Kubernetes", "caas;k8s;kubernetes");
        group("Go", "go");
        group("JavaScript", "javascript;es6");
        group("Functional programming", "abstractions;algebraic data types;algebraic laws;Coproducts;Coyoneda;effect systems;Either;Endo;Fantasy Land specification;foldMap;Free applicatives;Free monads;functional correctness;Identity;identity;interpreters;IO;lenses;manifolds;Maybe;monad transformers;Monoids;object safety;optics;Profunctors;Promises;Reader monad;Sequence;State monad;Traversable;Tuples;type systems;Writer monad;Yoneda");
        group("Architecture", "architecture;backend architecture;controller architecture;project architecture;provider architecture;worker architecture;domain services;domain-driven design;package boundaries;module systems;dependency injection;dependencies;dependency management;library design;maintainability");
        group("APIs", "APIs;API design;API gateway;API health;API migration;API schema;HTTP APIs;HTTP clients;remote APIs;client libraries;middleware");
        group("Data modelling", "data modelling;data export;data lifecycle;data portability;schema generation;query languages");
        group("Lifecycle management", "bootstrap;daemon lifecycle;library lifecycle;lifecycle management;model lifecycle;provider lifecycle;upgrades;upgrade workflow;runtime;runtime isolation");
        group("Migration", "migration;CLI migration;ecosystem migration;library migration;model migration;compatibility;interoperability;cross-model relations");
        group("Developer tooling", "developer tooling;build systems;CI;code generation;project automation;toolchains;static analysis;refactoring;diagnostics;terminal UI");
        group("Quality engineering", "testing;integration testing;property-based testing;testability;validation;code quality;performance");
        group("Observability", "observability;logging;metrics;tracing;OpenTelemetry;Prometheus;Loki;Tempo;InfluxDB;syslog;introspection");
        group("Security", "authentication;authorisation;RBAC;secrets;cryptography;macaroons;Bakery;TLS;SHA-256");
        group("Release engineering", "release engineering;release lifecycle;release management;release policy");
        group("Event-driven systems", "events;event streams;event systems;change streams;event-driven systems");
        group("User experience", "user experience;UX;user interfaces;Bubble Tea");
        return aliases;
    }());

    function normaliseExpertiseTags(value) {
        var seen = {};
        return value.split(";").map(function (tag) {
            tag = tag.trim();
            return expertiseAliases[tag.toLowerCase()] || tag;
        }).filter(function (tag) {
            if (!tag || seen[tag]) return false;
            seen[tag] = true;
            return true;
        });
    }

    function csvRows(text) {
        var rows = [], row = [], value = "", quoted = false;
        for (var i = 0; i < text.length; i++) {
            var char = text[i], next = text[i + 1];
            if (char === '"' && quoted && next === '"') { value += char; i++; }
            else if (char === '"') quoted = !quoted;
            else if (char === "," && !quoted) { row.push(value); value = ""; }
            else if ((char === "\n" || char === "\r") && !quoted) {
                if (char === "\r" && next === "\n") i++;
                row.push(value);
                if (row.some(function (field) { return field !== ""; })) rows.push(row);
                row = []; value = "";
            } else value += char;
        }
        if (value || row.length) { row.push(value); rows.push(row); }
        var headers = rows.shift();
        return rows.map(function (values) {
            var item = {};
            headers.forEach(function (header, index) { item[header] = values[index] || ""; });
            item.expertise_tags = item.expertise_tags ? normaliseExpertiseTags(item.expertise_tags) : [];
            item.repositories = item.repositories ? item.repositories.split(";").map(function (tag) { return tag.trim(); }).filter(Boolean) : [];
            return item;
        });
    }
    function escapeHtml(value) { var node = document.createElement("span"); node.textContent = value; return node.innerHTML; }
    function tagsFor(item, key) { return Array.isArray(item[key]) ? item[key] : (item[key] ? [item[key]] : []); }
    function activeCount() { return Object.keys(selected.include).length + Object.keys(selected.exclude).length; }
    function matches(item) {
        var included = Object.keys(selected.include);
        var excluded = Object.keys(selected.exclude);
        var hasTag = function (filter) { return tagsFor(item, filter.split("::")[0]).indexOf(filter.split("::")[1]) !== -1; };
        return (!included.length || included.some(hasTag)) && excluded.every(function (filter) { return !hasTag(filter); });
    }
    function makeFilterKey(group, tag) { return group + "::" + tag; }
    function render() {
        var filtered = entries.filter(matches);
        var includeCount = Object.keys(selected.include).length;
        var excludeCount = Object.keys(selected.exclude).length;
        var filterText = includeCount || excludeCount ? " · " + includeCount + " included, " + excludeCount + " excluded" : " across 2013–2023";
        document.getElementById("resume-results-meta").textContent = filtered.length + " " + (filtered.length === 1 ? "activity" : "activities") + filterText;
        var timeline = document.getElementById("resume-timeline");
        if (!filtered.length) { timeline.innerHTML = '<li class="resume-empty">No activities match those filters. Try clearing one or more tags.</li>'; return; }
        timeline.innerHTML = filtered.map(function (item) {
            var itemTags = groups.reduce(function (all, group) { return all.concat(tagsFor(item, group.key).map(function (tag) { return { key: group.key, tag: tag }; })); }, []);
            return '<li class="resume-entry"><time class="resume-date" datetime="' + escapeHtml(item.date) + '">' + escapeHtml(formatDate(item.date)) + '</time><article class="resume-card"><h3>' + escapeHtml(item.unit_of_work) + '</h3><p class="resume-summary">' + escapeHtml(item.summary) + '</p><div class="resume-entry-tags">' + itemTags.map(function (itemTag) { return '<button type="button" data-filter="' + escapeHtml(makeFilterKey(itemTag.key, itemTag.tag)) + '">' + escapeHtml(itemTag.tag) + '</button>'; }).join("") + '</div>' + (item.evidence ? '<p class="resume-evidence">Evidence: ' + escapeHtml(item.evidence) + '</p>' : "") + '</article></li>';
        }).join("");
        timeline.querySelectorAll("[data-filter]").forEach(function (button) { button.addEventListener("click", function () { toggleFilter(button.dataset.filter, "include"); }); });
    }
    function formatDate(value) { return new Date(value + "T12:00:00Z").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" }); }
    function toggleFilter(key, mode) {
        mode = mode || filterMode;
        var otherMode = mode === "include" ? "exclude" : "include";
        if (selected[mode][key]) delete selected[mode][key];
        else { delete selected[otherMode][key]; selected[mode][key] = true; }
        renderFilters(); render();
    }
    function renderFilterModes() {
        document.querySelectorAll(".resume-filter-mode").forEach(function (button) {
            var active = button.dataset.mode === filterMode;
            button.classList.toggle("is-active", active);
            button.setAttribute("aria-pressed", active);
        });
    }
    function renderFilters() {
        var target = document.getElementById("resume-filters");
        target.innerHTML = groups.map(function (group) {
            var tags = {};
            entries.forEach(function (item) { tagsFor(item, group.key).forEach(function (tag) { tags[tag] = true; }); });
            var values = Object.keys(tags).sort(function (a, b) { return a.localeCompare(b); });
            if (!values.length) return "";
            return '<div class="resume-filter-group"><span class="resume-filter-label">' + group.label + '</span><div class="resume-tags">' + values.map(function (tag) { var key = makeFilterKey(group.key, tag); var state = selected.include[key] ? "is-include" : (selected.exclude[key] ? "is-exclude" : ""); return '<button class="resume-tag ' + state + '" type="button" aria-pressed="' + Boolean(state) + '" data-filter="' + escapeHtml(key) + '">' + escapeHtml(tag) + '</button>'; }).join("") + '</div></div>';
        }).join("");
        target.querySelectorAll("[data-filter]").forEach(function (button) { button.addEventListener("click", function () { toggleFilter(button.dataset.filter); }); });
    }
    document.querySelectorAll(".resume-filter-mode").forEach(function (button) { button.addEventListener("click", function () { filterMode = button.dataset.mode; renderFilterModes(); }); });
    document.getElementById("resume-filter-title").addEventListener("click", function () {
        var panel = document.querySelector(".resume-filter-panel");
        var collapsed = panel.classList.toggle("is-collapsed");
        this.setAttribute("aria-expanded", !collapsed);
    });
    document.getElementById("resume-clear").addEventListener("click", function () { selected = { include: {}, exclude: {} }; renderFilters(); render(); });
    Promise.all(sources.map(function (source) { return fetch(source).then(function (response) { if (!response.ok) throw new Error("Could not load data"); return response.text(); }); }))
        .then(function (files) {
            entries = files.reduce(function (all, text) { return all.concat(csvRows(text)); }, []).sort(function (a, b) { return b.date.localeCompare(a.date); });
            document.getElementById("resume-status").textContent = "";
            document.querySelector(".resume-filter-panel").hidden = false;
            renderFilters(); render();
        })
        .catch(function () { document.getElementById("resume-status").textContent = "Activity data could not be loaded. Please try again later."; });
}());
</script>
