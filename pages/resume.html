    #resume-viewer .resume-filter-modes { display: grid; width: 100%; gap: 4px; margin: 12px 0 0; padding: 6px 8px; border-top: 2px solid #808080; border-left: 2px solid #808080; border-right: 2px solid #fff; border-bottom: 2px solid #fff; }

    @media (max-width: 760px) {

        #resume-viewer .resume-card { padding-left: 0; }
    }
</style>

<main id="resume-viewer" aria-labelledby="resume-title">
    <h1 id="resume-title">A record of making things.</h1>
    <p class="resume-intro">A filterable timeline of engineering work across Juju, Convoy, Fantasy Land, Coherence, Colossus, and Snowy.</p>
    <p class="resume-status" id="resume-status" aria-live="polite">Loading activity records…</p>
    <div id="settings-panel" class="win-window is-minimap-hidden" tabindex="0" role="region" aria-label="Resume settings">
        <div id="settings-grab" class="win-grab">
            <button id="settings-minimize" title="Minimize">_</button>
            <button class="dock-undock-btn" title="Undock" style="display:none;">&#9776;</button>
            <div id="settings-grab-track" class="win-grab-track"></div>
        </div>
        <div id="settings-chrome" class="win-chrome">
            <div id="settings-body" class="win-body">
                <div class="settings-fieldset resume-filter-panel" aria-label="Filters">
                    <div class="settings-legend">Filters</div>
                    <button id="resume-minimap-toggle" type="button" disabled>Loading minimap…</button>
                    <section class="resume-minimap" id="resume-minimap-panel" aria-label="Visible activities across time" hidden>
                        <div class="resume-minimap-axis"><span id="resume-minimap-start"></span><span id="resume-minimap-end"></span></div>
                        <div class="resume-minimap-track" id="resume-minimap-track"></div>
                    </section>
                    <div class="resume-filter-lists" id="resume-filters"></div>
                    <fieldset class="resume-filter-modes" aria-label="Tag filter mode">
                        <label><input type="radio" name="resume-filter-mode" value="include" checked> Include tags</label>
                        <label><input type="radio" name="resume-filter-mode" value="exclude"> Exclude tags</label>
                    </fieldset>
                    <button class="resume-clear" id="resume-clear" type="button">clear filters</button>
                </div>
            </div>
        </div>
    </div>
    <p class="resume-results-meta" id="resume-results-meta"></p>
    <ol class="resume-timeline" id="resume-timeline"></ol>
    <p class="resume-evidence">Source data: <a href="https://gist.githubusercontent.com/SimonRichardson/1e8fc2ee19ea5c72134d222760efae35/raw/5211f8313a5e434957a15049311bb9b099fb02d5/juju.csv">Juju</a>, <a href="https://gist.githubusercontent.com/SimonRichardson/47ec0f2aab2d74a53a389c4fcedffe99/raw/bb9bfb11f6631a03a8873d75a466788a7f972031/convoy.csv">Convoy</a>, <a href="https://gist.githubusercontent.com/SimonRichardson/09843adb65f43b28f56ea18cc2915e2c/raw/f3fd3cee16326e81395ec86fd70341f762361fed/fantasy.csv">Fantasy Land</a>, <a href="https://gist.githubusercontent.com/SimonRichardson/44cd3b040ed25ce0e9117b80a0a8b764/raw/1c87feec52670d23172ae2f76771e56dac5db836/coherence.csv">Coherence</a>, <a href="https://gist.githubusercontent.com/SimonRichardson/fb42ae1c957bab03df464db8db12b784/raw/940016fe9790936baff826d32557c4223f51795d/colossus.csv">Colossus</a>, and <a href="https://gist.githubusercontent.com/SimonRichardson/8a1b12d795e4acf7b51990b02c7f762e/raw/b12b6c8913fe13343b396c5e4c74b8cc8f035821/snowy.csv">Snowy</a>.</p>
</main>

<script>

        "https://gist.githubusercontent.com/SimonRichardson/47ec0f2aab2d74a53a389c4fcedffe99/raw/bb9bfb11f6631a03a8873d75a466788a7f972031/convoy.csv",
        "https://gist.githubusercontent.com/SimonRichardson/09843adb65f43b28f56ea18cc2915e2c/raw/f3fd3cee16326e81395ec86fd70341f762361fed/fantasy.csv",
        "https://gist.githubusercontent.com/SimonRichardson/44cd3b040ed25ce0e9117b80a0a8b764/raw/1c87feec52670d23172ae2f76771e56dac5db836/coherence.csv",
        "https://gist.githubusercontent.com/SimonRichardson/fb42ae1c957bab03df464db8db12b784/raw/940016fe9790936baff826d32557c4223f51795d/colossus.csv",

    var optionMarqueeTimer;

        { key: "role_tag", label: "Role" },
        { key: "expertise_tags", label: "Expertise" },
        { key: "repositories", label: "Repository" }

    // The activity title, summary, and evidence retain the implementation detail.
    var expertiseAliases = (function () {
        var aliases = {}, exactAliases = {};

            tags.split(";").forEach(function (tag) {

                aliases[tag.toLowerCase()] = name;

        }
        group("Databases", "database;databases;dqlite;SQLite;Mongo;MongoDB;SQL;SQLair;InfluxDB");
        group("Kubernetes", "caas;k8s;kubernetes");
        group("Go", "go");
        group("JavaScript", "javascript;es6");
        group("Functional programming", "abstractions;algebraic data types;algebraic laws;Coproducts;Coyoneda;effect systems;Either;Endo;Fantasy Land specification;foldMap;Free applicatives;Free monads;functional correctness;Identity;interpreters;IO;lenses;manifolds;Maybe;monad transformers;Monoids;object safety;optics;Profunctors;Promises;Reader monad;Sequence;State monad;Traversable;Tuples;type systems;Writer monad;Yoneda;functional programming");
        group("Architecture", "architecture;backend architecture;controller architecture;project architecture;provider architecture;worker architecture;domain services;domain-driven design;package boundaries;module systems;dependency injection;dependencies;dependency management;library design;maintainability;distributed systems;data structures;consistent hashing;red-black trees;ticketing systems;service architecture;filesystems;remote storage;frontend architecture;maintenance;Raft;leader election;membership;cluster management;cluster balancing;cluster bootstrap;service discovery;replication;backends");
        group("APIs", "APIs;API design;API gateway;API health;API migration;API schema;HTTP APIs;HTTP clients;remote APIs;client libraries;middleware;REST APIs;multipart uploads;HTTP routing");
        group("Data modelling", "data modelling;data export;data lifecycle;data portability;schema generation;query languages;append-only ledgers;append-only storage;ledgers;document storage;document versioning;querying;content storage;content-addressable storage;document management;metadata;document revisioning;audit trails;storage;object storage;ZIP;document modelling;data encoding;UUIDs");
        group("Lifecycle management", "bootstrap;daemon lifecycle;library lifecycle;lifecycle management;model lifecycle;provider lifecycle;upgrades;upgrade workflow;runtime;runtime isolation;workload management;worker;workers;asynchronous workers;worker engine;Docker;deployment;configuration;operations;cluster health;probes");
        group("Migration", "migration;CLI migration;ecosystem migration;library migration;model migration;compatibility;interoperability;cross-model relations");
        group("Developer tooling", "developer tooling;build systems;CI;code generation;project automation;toolchains;static analysis;refactoring;diagnostics;terminal UI;CLI;developer experience;documentation;open source;open-source maintenance");
        group("Quality engineering", "testing;integration testing;property-based testing;testability;validation;code quality;performance;quorum;coordination;reliability;resilience;HA;Bloom filters;probabilistic data structures;content validation;error handling;data integrity;collision detection");
        group("Observability", "observability;logging;metrics;tracing;OpenTelemetry;Prometheus;Loki;Tempo;syslog;introspection;statistics;signals");
        group("Security", "authentication;authorisation;identity;RBAC;secrets;cryptography;macaroons;Bakery;TLS;SHA-256;encryption;security");
        group("Release engineering", "release engineering;release lifecycle;release management;release policy");
        group("Event-driven systems", "events;event streams;event systems;change streams;event-driven systems;watchers");
        group("User experience", "user experience;UX;user interfaces;Bubble Tea;Elm");
        return { exact: exactAliases, insensitive: aliases };
    }());

    function normaliseExpertiseTags(value) {
        var seen = {};
        return value.split(";").map(function (tag) {
            tag = tag.trim();
            return expertiseAliases.exact[tag] || expertiseAliases.insensitive[tag.toLowerCase()] || tag;
        }).filter(function (tag) {
            if (!tag || seen[tag]) return false;
            seen[tag] = true;
            return true;
        });
    }

    function csvRows(text) {
        var rows = [], row = [], value = "", quoted = false;
        for (var i = 0; i < text.length; i++) {
            var char = text[i], next = text[i + 1];
            if (char === '"' && quoted && next === '"') { value += char; i++; }
            else if (char === '"') quoted = !quoted;
            else if (char === "," && !quoted) { row.push(value); value = ""; }
            else if ((char === "\n" || char === "\r") && !quoted) {
                if (char === "\r" && next === "\n") i++;
                row.push(value);
                if (row.some(function (field) { return field !== ""; })) rows.push(row);
                row = []; value = "";
            } else value += char;
        }
        if (value || row.length) { row.push(value); rows.push(row); }
        var headers = rows.shift();
        return rows.map(function (values) {
            var item = {};
            headers.forEach(function (header, index) { item[header] = values[index] || ""; });
            item.expertise_tags = item.expertise_tags ? normaliseExpertiseTags(item.expertise_tags) : [];

        var hash = 0;

    }
    function activityDateRange() {
        var years = entries.map(function (item) { return item.date.slice(0, 4); }).sort();
        if (!years.length) return "";

    }
    function markerColours(item) {
        var active = Object.keys(selected.include).concat(Object.keys(selected.exclude));
        var itemTags = groups.reduce(function (all, group) { return all.concat(tagsFor(item, group.key).map(function (tag) { return makeFilterKey(group.key, tag); })); }, []);
        var keys = active.length ? itemTags.filter(function (key) { return active.indexOf(key) !== -1; }) : itemTags;

    }
    function renderMinimap(filtered) {
        var dates = entries.map(function (item) { return Date.parse(item.date + "T12:00:00Z"); });

    }
    function makeFilterKey(group, tag) { return group + "::" + tag; }

        var includeCount = Object.keys(selected.include).length;
        var excludeCount = Object.keys(selected.exclude).length;

            var itemTags = groups.reduce(function (all, group) { return all.concat(tagsFor(item, group.key).map(function (tag) { return { key: group.key, tag: tag }; })); }, []);

    function updateOptionMarquees() {
        document.querySelectorAll("#resume-filters select").forEach(function (list) {

                var offset = Number(option.dataset.marqueeOffset || "0");
                var loopedLabel = label + "     ";
                option.textContent = loopedLabel.slice(offset) + loopedLabel.slice(0, offset) + label;
                option.dataset.marqueeOffset = String((offset + 1) % loopedLabel.length);
            });
        });
    }
    function startOptionMarquees() {
        if (optionMarqueeTimer) clearInterval(optionMarqueeTimer);
        updateOptionMarquees();
        optionMarqueeTimer = setInterval(updateOptionMarquees, 180);
    }
    function renderFilters() {
        var target = document.getElementById("resume-filters");
        target.innerHTML = groups.map(function (group) {
            var options = tagsForGroup(group).map(function (tag) {
                var key = makeFilterKey(group.key, tag);
                return '<option value="' + escapeHtml(key) + '" data-label="' + escapeHtml(tag) + '"' + (selected[filterMode][key] ? ' selected' : '') + '>' + escapeHtml(tag) + '</option>';
            }).join("");
            var hasSelection = tagsForGroup(group).some(function (tag) {
                var key = makeFilterKey(group.key, tag);
                return selected.include[key] || selected.exclude[key];
            });
            return '<label class="resume-filter-list"><span class="resume-filter-label">' + escapeHtml(group.label) + '</span><select multiple size="6" data-group="' + escapeHtml(group.key) + '" aria-label="' + escapeHtml(group.label) + ' filters"><option value="" data-label="" aria-label="No filter"' + (hasSelection ? '' : ' selected') + '></option>' + options + '</select></label>';
        }).join("");
        target.querySelectorAll("select[data-group]").forEach(function (list) {
            list.addEventListener("change", function () {
                var groupKey = list.dataset.group;
                tagsForGroup(groups.filter(function (group) { return group.key === groupKey; })[0]).forEach(function (tag) {
                    var key = makeFilterKey(groupKey, tag);
                    delete selected[filterMode][key];
                });
                var hasTagSelection = Array.prototype.some.call(list.selectedOptions, function (option) { return option.value; });
                if (!hasTagSelection) {
                    tagsForGroup(groups.filter(function (group) { return group.key === groupKey; })[0]).forEach(function (tag) {
                        delete selected.include[makeFilterKey(groupKey, tag)];
                        delete selected.exclude[makeFilterKey(groupKey, tag)];
                    });
                }
                Array.prototype.forEach.call(list.selectedOptions, function (option) {
                    if (!option.value) return;
                    var otherMode = filterMode === "include" ? "exclude" : "include";
                    delete selected[otherMode][option.value];
                    selected[filterMode][option.value] = true;
                });
                updateOptionMarquees();
                render();
            });
        });
        startOptionMarquees();
    }
    document.querySelectorAll("input[name='resume-filter-mode']").forEach(function (input) { input.addEventListener("change", function () { if (input.checked) { filterMode = input.value; renderFilterModes(); renderFilters(); } }); });
    var settingsPanel = document.getElementById("settings-panel");
    var minimapPanel = document.getElementById("resume-minimap-panel");
    var minimapToggle = document.getElementById("resume-minimap-toggle");
    function setMinimapVisibility(hidden) {
        minimapPanel.hidden = hidden;
        settingsPanel.classList.toggle("is-minimap-hidden", hidden);
        minimapToggle.textContent = hidden ? "Show minimap" : "Hide minimap";
        if (window.__dockSystem) setTimeout(function () { window.__dockSystem.dock(); }, 0);
    }
    minimapToggle.addEventListener("click", function () { setMinimapVisibility(!minimapPanel.hidden); });
    document.getElementById("settings-minimize").addEventListener("click", function () {
        var chrome = document.getElementById("settings-chrome");
        chrome.style.display = chrome.style.display === "none" ? "flex" : "none";
        if (window.__dockSystem) setTimeout(function () { window.__dockSystem.dock(); }, 0);
    });
    if (window.makeDraggable) window.makeDraggable("settings", settingsPanel, document.getElementById("settings-grab-track"));
    window.__homeCanvasCleanup = function () {
        if (optionMarqueeTimer) clearInterval(optionMarqueeTimer);
    };
    document.getElementById("resume-clear").addEventListener("click", function () { selected = { include: {}, exclude: {} }; renderFilters(); render(); });
    Promise.all(sources.map(loadSource))
        .then(function (files) {
            entries = files.reduce(function (all, text) { return all.concat(csvRows(text)); }, []).sort(function (a, b) { return b.date.localeCompare(a.date); });
            document.getElementById("resume-status").textContent = "";
            settingsPanel.style.display = "";
            minimapToggle.disabled = false;
            setMinimapVisibility(false);
            renderFilters(); render();
        })
        .catch(function () { document.getElementById("resume-status").textContent = "Activity data could not be loaded. Please try again later."; });
}());
</script>
