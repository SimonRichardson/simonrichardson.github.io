<div id="settings-panel" class="win-window" tabindex="0" role="region" aria-label="Settings">
    <div id="settings-grab" class="win-grab">
        <button id="settings-minimize" title="Minimize">_</button>
        <button class="dock-undock-btn" title="Undock" style="display:none;">&#9776;</button>
        <div id="settings-grab-track" class="win-grab-track"></div>
    </div>
    <div id="settings-chrome" class="win-chrome">
        <div id="settings-body" class="win-body">
            <div class="settings-fieldset collapsed">
                <div class="settings-legend">About</div>
                <p>Ocean waves. Gerstner wave simulation on a 3D plane with a rope box.</p>
            </div>
            <div class="settings-fieldset">
                <div class="settings-legend">Controls</div>
                <label>
                    Noise
                    <input type="range" id="setting-noise" min="1" max="20" value="10">
                </label>
                <label>
                    Grid Size
                    <input type="range" id="setting-grid" min="16" max="80" value="56">
                </label>
                <label>
                    <input type="checkbox" id="setting-autorotate" checked>
                    Auto-rotate
                </label>
            </div>
        </div>
    </div>
</div>
<canvas id="home-canvas"></canvas>
<script>
(function() {
    var settingsPanel = document.getElementById("settings-panel");

    var settings = {
        noise: 10,
        grid: 56,
        autoRotate: true
    };

    document.getElementById("settings-minimize").addEventListener("click", function() {
        var body = document.getElementById("settings-body");
        body.style.display = body.style.display === "none" ? "block" : "none";
    });

    var legends = document.querySelectorAll("#settings-body .settings-legend");
    for (var i = 0; i < legends.length; i++) {
        legends[i].addEventListener("click", function() {
            this.parentElement.classList.toggle("collapsed");
            if (window.__dockSystem) setTimeout(function() { window.__dockSystem.dock(); }, 50);
        });
    }

    document.getElementById("setting-noise").addEventListener("input", function() {
        settings.noise = parseInt(this.value, 10) || 10;
    });
    document.getElementById("setting-grid").addEventListener("input", function() {
        settings.grid = parseInt(this.value, 10) || 56;
        rebuildBuffers();
    });
    document.getElementById("setting-autorotate").addEventListener("change", function() {
        settings.autoRotate = this.checked;
    });

    window.makeDraggable("settings", settingsPanel, document.getElementById("settings-grab-track"));

    var canvas = document.getElementById("home-canvas");
    if (!canvas) return;
    var ctx = canvas.getContext("2d");

    function resize() {
        if (!canvas.parentElement) return;
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }
    resize();
    window.addEventListener("resize", resize);

    // --- 3D setup ---
    var PERSPECTIVE = 600;
    var PLANE_SIZE = 250;
    var rotY = 0.5, rotX = -0.85;
    var camDragging = false, lastMX = 0;
    var cosY, sinY, cosX, sinX;

    canvas.addEventListener("mousedown", function(e) { camDragging = true; lastMX = e.clientX; });
    document.addEventListener("mousemove", function(e) {
        if (!camDragging) return;
        rotY += (e.clientX - lastMX) * 0.005;
        lastMX = e.clientX;
    });
    document.addEventListener("mouseup", function() { camDragging = false; });
    canvas.addEventListener("touchstart", function(e) { camDragging = true; lastMX = e.touches[0].clientX; });
    document.addEventListener("touchmove", function(e) {
        if (!camDragging) return;
        rotY += (e.touches[0].clientX - lastMX) * 0.005;
        lastMX = e.touches[0].clientX;
    });
    document.addEventListener("touchend", function() { camDragging = false; });

    function updateTrig() {
        cosY = Math.cos(rotY); sinY = Math.sin(rotY);
        cosX = Math.cos(rotX); sinX = Math.sin(rotX);
    }

    function rot3d(x, y, z) {
        var rx = x * cosY + z * sinY;
        var rz = -x * sinY + z * cosY;
        var ry = y * cosX - rz * sinX;
        var rz2 = y * sinX + rz * cosX;
        return [rx, ry, rz2];
    }

    function proj(x, y, z) {
        var s = PERSPECTIVE / (PERSPECTIVE + z);
        return [canvas.width / 2 + x * s, canvas.height / 2 - y * s, s];
    }

    // --- Simple hash for noise ---
    function hash(x, z) {
        var n = Math.sin(x * 127.1 + z * 311.7) * 43758.5453;
        return n - Math.floor(n);
    }

    function smoothNoise(x, z) {
        var ix = Math.floor(x), iz = Math.floor(z);
        var fx = x - ix, fz = z - iz;
        fx = fx * fx * (3 - 2 * fx);
        fz = fz * fz * (3 - 2 * fz);
        var a = hash(ix, iz);
        var b = hash(ix + 1, iz);
        var c = hash(ix, iz + 1);
        var d = hash(ix + 1, iz + 1);
        return a + (b - a) * fx + (c - a) * fz + (a - b - c + d) * fx * fz;
    }

    // --- Gerstner waves ---
    var waves = [];
    var NUM_WAVES = 16;

    function initWaves() {
        waves = [];
        for (var i = 0; i < NUM_WAVES; i++) {
            var f = 0.01 + i * 0.009 + Math.random() * 0.005;
            var angle = (Math.random() - 0.5) * Math.PI * 0.8;
            waves.push({
                amp: (1.0 / (1 + i * 0.35)) * 1.6,
                freq: f,
                speed: Math.sqrt(9.81 / (f * Math.PI * 2)) * 0.35,
                dirX: Math.sin(angle),
                dirZ: Math.cos(angle),
                phase: Math.random() * Math.PI * 2
            });
        }
    }
    initWaves();

    function gerstner(wx, wz, t, windAmp, chopScale, noiseScale) {
        var dx = 0, dy = 0, dz = 0;
        for (var i = 0; i < waves.length; i++) {
            var w = waves[i];
            var k = w.freq * Math.PI * 2;
            var dot = w.dirX * wx + w.dirZ * wz;
            var phase = k * dot - w.speed * k * t + w.phase;
            var s = Math.sin(phase) * windAmp;
            var c = Math.cos(phase) * windAmp;
            dy += w.amp * c;
            dx -= chopScale * w.dirX * w.amp * s;
            dz -= chopScale * w.dirZ * w.amp * s;
        }
        // Add noise displacement
        var nVal = (smoothNoise(wx * 0.008 + t * 0.3, wz * 0.008 + t * 0.2) - 0.5) * 2;
        nVal += (smoothNoise(wx * 0.02 + t * 0.5, wz * 0.02 - t * 0.3) - 0.5);
        dy += nVal * noiseScale;
        return [dx, dy, dz];
    }

    // --- Render mesh ---
    var MESH, MESH_CELL, vtxCount, projX, projY, projZ, vtxH;

    function rebuildBuffers() {
        MESH = settings.grid;
        MESH_CELL = (PLANE_SIZE * 2) / MESH;
        vtxCount = (MESH + 1) * (MESH + 1);
        projX = new Float32Array(vtxCount);
        projY = new Float32Array(vtxCount);
        projZ = new Float32Array(vtxCount);
        vtxH = new Float32Array(vtxCount);
    }
    rebuildBuffers();

    var time = 0;

    function buildMesh() {
        var windAmp = 0.1 + Math.max(0, Math.sin(time * 0.1) * 0.5 + 0.5) * 0.2;
        var chopScale = 1;
        var noiseScale = settings.noise * 0.15;
        var BASE_Y = 18;

        for (var jz = 0; jz <= MESH; jz++) {
            for (var jx = 0; jx <= MESH; jx++) {
                var vi = jz * (MESH + 1) + jx;
                var wx = (jx - MESH / 2) * MESH_CELL;
                var wz = (jz - MESH / 2) * MESH_CELL;

                var d = gerstner(wx, wz, time, windAmp, chopScale, noiseScale);
                var r = rot3d(wx + d[0], BASE_Y + d[1] * 10, wz + d[2]);
                var p = proj(r[0], r[1], r[2]);
                projX[vi] = p[0];
                projY[vi] = p[1];
                projZ[vi] = r[2];
                vtxH[vi] = d[1];
            }
        }
    }

    function drawWater() {
        // Sort rows by depth
        var rowOrder = [];
        for (var jz = 0; jz < MESH; jz++) {
            var midVi = jz * (MESH + 1) + Math.floor(MESH / 2);
            rowOrder.push([jz, projZ[midVi]]);
        }
        rowOrder.sort(function(a, b) { return b[1] - a[1]; });

        for (var ri = 0; ri < rowOrder.length; ri++) {
            var jz = rowOrder[ri][0];
            for (var jx = 0; jx < MESH; jx++) {
                var v00 = jz * (MESH+1) + jx;
                var v10 = v00 + 1;
                var v01 = v00 + (MESH+1);
                var v11 = v01 + 1;

                var x0 = projX[v00], y0 = projY[v00];
                var x1 = projX[v10], y1 = projY[v10];
                var x2 = projX[v11], y2 = projY[v11];
                var x3 = projX[v01], y3 = projY[v01];

                // Expand quad slightly to eliminate anti-alias gaps
                var cx = (x0 + x1 + x2 + x3) * 0.25;
                var cy = (y0 + y1 + y2 + y3) * 0.25;
                var ex = 1.004;
                x0 = cx + (x0 - cx) * ex; y0 = cy + (y0 - cy) * ex;
                x1 = cx + (x1 - cx) * ex; y1 = cy + (y1 - cy) * ex;
                x2 = cx + (x2 - cx) * ex; y2 = cy + (y2 - cy) * ex;
                x3 = cx + (x3 - cx) * ex; y3 = cy + (y3 - cy) * ex;

                var h = (vtxH[v00] + vtxH[v10] + vtxH[v01] + vtxH[v11]) * 0.25;
                var v = Math.min(255, Math.max(0, 40 + h * 30)) | 0;
                ctx.fillStyle = "rgb(" + v + "," + v + "," + v + ")";

                ctx.beginPath();
                ctx.moveTo(x0, y0);
                ctx.lineTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.lineTo(x3, y3);
                ctx.closePath();
                ctx.fill();
            }
        }
    }

    // --- Ground plane ---
    function drawGround() {
        var corners = [[-PLANE_SIZE,0,-PLANE_SIZE],[PLANE_SIZE,0,-PLANE_SIZE],[PLANE_SIZE,0,PLANE_SIZE],[-PLANE_SIZE,0,PLANE_SIZE]];
        var pts = [];
        for (var i = 0; i < 4; i++) {
            var r = rot3d(corners[i][0], corners[i][1], corners[i][2]);
            pts.push(proj(r[0], r[1], r[2]));
        }
        ctx.beginPath();
        ctx.moveTo(pts[0][0], pts[0][1]);
        for (var i = 1; i < 4; i++) ctx.lineTo(pts[i][0], pts[i][1]);
        ctx.closePath();
        ctx.fillStyle = "#000000";
        ctx.fill();
    }

    // --- Rope box ---
    var ROPE_HEIGHT = 42;
    function drawRope() {
        var corners = [[-PLANE_SIZE,-PLANE_SIZE],[PLANE_SIZE,-PLANE_SIZE],[PLANE_SIZE,PLANE_SIZE],[-PLANE_SIZE,PLANE_SIZE]];
        var pts = [];
        for (var i = 0; i < 4; i++) {
            var r = rot3d(corners[i][0], ROPE_HEIGHT, corners[i][1]);
            pts.push(proj(r[0], r[1], r[2]));
        }
        ctx.beginPath();
        ctx.moveTo(pts[0][0], pts[0][1]);
        for (var i = 1; i < 4; i++) ctx.lineTo(pts[i][0], pts[i][1]);
        ctx.closePath();
        ctx.strokeStyle = "rgba(220,220,220,0.5)";
        ctx.lineWidth = 1.5;
        ctx.stroke();
    }

    // --- Main loop ---
    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (settings.autoRotate && !camDragging) rotY += 0.0015;
        updateTrig();

        var dt = 1 / 60;
        time += dt;

        buildMesh();

        drawGround();
        drawWater();
        drawRope();

        window.__homeCanvasAnimId = requestAnimationFrame(loop);
    }

    loop();
})();
</script>
